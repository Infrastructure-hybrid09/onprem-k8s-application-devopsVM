---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: neuroplan-gateway
  labels:
    app.kubernetes.io/part-of: neuroplan
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      hostname: app.nplan.local
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nplan-tls-v2
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neuroplan-login-mvp
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  parentRefs:
    - name: neuroplan-gateway
      sectionName: https
  hostnames:
    - app.nplan.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: neuroplan-backend
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: neuroplan-frontend
          port: 80
