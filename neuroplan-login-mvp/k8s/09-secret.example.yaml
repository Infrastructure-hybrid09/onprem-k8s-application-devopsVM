# 예시 파일입니다. 실제 비밀번호를 Git에 저장하지 마세요.
# 권장 생성 명령은 README.md의 kubectl create secret 명령을 사용합니다.
apiVersion: v1
kind: Secret
metadata:
  name: neuroplan-auth-secrets
type: Opaque
stringData:
  DB_USERNAME: ir_app
  DB_PASSWORD: REPLACE_WITH_REAL_PASSWORD
  # `openssl rand -base64 48` 결과를 사용합니다.
  JWT_SECRET_BASE64: REPLACE_WITH_BASE64_SECRET
---
# Cloudflare 값은 실제 배포 시 kubectl 프롬프트 방식으로 생성하고 Git에 저장하지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: neuroplan-llm-secrets
type: Opaque
stringData:
  LLM_ACCOUNT_ID: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
  LLM_API_KEY: REPLACE_WITH_CLOUDFLARE_API_TOKEN
