apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroplan-backend-config
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
data:
  # 현재 격리된 Data Network의 MaxScale 4006 리스너는 TLS 미구성입니다.
  DB_URL: jdbc:mariadb://192.168.44.21:4006/infraready?sslMode=disable
  JWT_ISSUER: neuroplan-auth
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  JWT_REAUTH_TTL: 5m
  AUTH_COOKIE_SECURE: "true"
  # MVP 관리자 계정. 운영 전 팀 승인 이메일로 교체합니다(여러 개는 쉼표로 구분).
  ADMIN_EMAILS: admin@nplan.local
  LLM_ENABLED: "true"
  LLM_PROVIDER: CLOUDFLARE
  LLM_BASE_URL: https://api.cloudflare.com/client/v4
  LLM_MODEL: "@cf/qwen/qwen3.8-27b"
  LLM_PROMPT_VERSION: neuroplan-0.8.0-v2
  LLM_MAX_COMPLETION_TOKENS: "1200"
  LLM_DAILY_TOKEN_LIMIT: "20000"
  LLM_CONNECT_TIMEOUT_SECONDS: "5"
  LLM_READ_TIMEOUT_SECONDS: "90"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/name: neuroplan-frontend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuroplan-frontend
        app.kubernetes.io/part-of: neuroplan-login-mvp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: 192.168.34.21:5000/neuroplan/frontend
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/name: neuroplan-frontend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  selector:
    app.kubernetes.io/name: neuroplan-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/name: neuroplan-backend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  # 세션 상태를 MariaDB jwt_sessions에 저장하므로 복제본 간 로그인이 유지됩니다.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuroplan-backend
        app.kubernetes.io/part-of: neuroplan-login-mvp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: 192.168.34.21:5000/neuroplan/backend
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: neuroplan-backend-config
            - secretRef:
                name: neuroplan-auth-secrets
            - secretRef:
                name: neuroplan-llm-secrets
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/name: neuroplan-backend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  selector:
    app.kubernetes.io/name: neuroplan-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-backend
